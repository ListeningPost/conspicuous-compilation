[package]
name = "llnv-demo"
version = "0.1.0"
edition = "2021"
description = "Showcase for #[llnv_obfuscate] built through the cargo/LLVM backend."

[dependencies]
llnv-rust-obf = { path = ".." }

[[bin]]
name = "demo"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "edge"
path = "src/edge.rs"
