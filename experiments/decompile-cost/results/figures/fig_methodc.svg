<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans,Arial,sans-serif">
  <style>
    .lbl{font-size:10px;fill:#1c1f24}
    .sub{font-size:8.5px;fill:#6b7480}
    .m{font-family:"Liberation Mono",monospace;font-size:9px;fill:#1c1f24}
    .box{fill:#eef1f0;stroke:#5b6671;stroke-width:1.1}
    .crit{fill:#f6f4ef;stroke:#8C4E08;stroke-width:1.2}
    .row{fill:#ffffff;stroke:#c9ccd2;stroke-width:0.8}
    .rowhit{fill:#d8ece4;stroke:#0E6B4F;stroke-width:1.6}
    .vrun{fill:#d8ece4;stroke:#0E6B4F;stroke-width:1.6}
    .vidle{fill:#f3f1ec;stroke:#c9ccd2;stroke-width:1;opacity:.75}
    .e{stroke:#5b6671;stroke-width:1.1;fill:none;marker-end:url(#a)}
    .eg{stroke:#0E6B4F;stroke-width:1.6;fill:none;marker-end:url(#ag)}
    .t{font-size:8.5px;fill:#1c1f24}
    .acc{fill:#0E6B4F;font-weight:700}
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5b6671"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0E6B4F"/></marker>
  </defs>

  <!-- criteria pipeline (top) -->
  <text x="24" y="30" class="sub">every call</text>
  <circle cx="44" cy="62" r="15" class="box"/>
  <line x1="44" y1="62" x2="44" y2="52" stroke="#1c1f24" stroke-width="1.3"/>
  <line x1="44" y1="62" x2="52" y2="66" stroke="#1c1f24" stroke-width="1.3"/>
  <text x="44" y="94" class="t" text-anchor="middle">wall clock t</text>
  <path class="e" d="M62,62 L96,62"/>
  <rect class="box" x="98" y="48" width="78" height="28" rx="3"/><text x="137" y="66" class="m" text-anchor="middle">H(t)</text>
  <text x="137" y="90" class="sub" text-anchor="middle">murmur hash</text>
  <path class="e" d="M176,62 L210,62"/>
  <rect class="crit" x="212" y="46" width="150" height="32" rx="3"/>
  <text x="287" y="60" class="m" text-anchor="middle">e = H(t) mod K</text>
  <text x="287" y="72" class="sub" text-anchor="middle">the criteria → an index</text>
  <path class="eg" d="M362,62 C400,62 400,96 424,96"/>

  <!-- hash table (K entries) -->
  <text x="430" y="30" class="lbl" font-weight="700">table[K]</text>
  <g>
    <rect class="row"    x="424" y="40"  width="56" height="22" rx="2"/><text x="452" y="55" class="m" text-anchor="middle">0</text>
    <rect class="row"    x="424" y="64"  width="56" height="22" rx="2"/><text x="452" y="79" class="m" text-anchor="middle">1</text>
    <rect class="rowhit" x="424" y="88"  width="56" height="22" rx="2"/><text x="452" y="103" class="m acc" text-anchor="middle">e=2</text>
    <rect class="row"    x="424" y="112" width="56" height="22" rx="2"/><text x="452" y="127" class="m" text-anchor="middle">3</text>
    <rect class="row"    x="424" y="136" width="56" height="22" rx="2"/><text x="452" y="151" class="m" text-anchor="middle">4</text>
    <text x="452" y="172" class="m" text-anchor="middle">⋮</text>
    <rect class="row"    x="424" y="178" width="56" height="22" rx="2"/><text x="452" y="193" class="m" text-anchor="middle">K−1</text>
  </g>

  <!-- K variant bodies -->
  <text x="560" y="30" class="lbl" font-weight="700">K differently-flattened bodies</text>
  <rect class="vidle" x="540" y="40"  width="150" height="22" rx="2"/><text x="548" y="55" class="t">v0  · maze A · idle</text>
  <rect class="vidle" x="540" y="64"  width="150" height="22" rx="2"/><text x="548" y="79" class="t">v1  · maze B · idle</text>
  <rect class="vrun"  x="540" y="88"  width="150" height="22" rx="2"/><text x="548" y="103" class="t acc">v2  · maze C · RUNS</text>
  <rect class="vidle" x="540" y="112" width="150" height="22" rx="2"/><text x="548" y="127" class="t">v3  · maze D · idle</text>
  <rect class="vidle" x="540" y="136" width="150" height="22" rx="2"/><text x="548" y="151" class="t">v4  · maze E · idle</text>
  <text x="615" y="172" class="m" text-anchor="middle">⋮</text>
  <rect class="vidle" x="540" y="178" width="150" height="22" rx="2"/><text x="548" y="193" class="t">v(K−1) · idle</text>

  <!-- table->body links -->
  <path class="e"  d="M480,51 L540,51"/>
  <path class="e"  d="M480,75 L540,75"/>
  <path class="eg" d="M480,99 L540,99"/>
  <path class="e"  d="M480,123 L540,123"/>
  <path class="e"  d="M480,147 L540,147"/>
  <path class="e"  d="M480,189 L540,189"/>

  <!-- converge to identical result -->
  <path class="eg" d="M690,99 C712,99 712,250 360,250"/>
  <path class="e"  d="M690,51 C706,51 706,244 366,250" opacity=".4"/>
  <path class="e"  d="M690,189 C706,189 706,256 366,250" opacity=".4"/>
  <rect class="crit" x="150" y="238" width="210" height="26" rx="3"/>
  <text x="255" y="255" class="m" text-anchor="middle">same observable result</text>
  <text x="255" y="284" class="sub" text-anchor="middle">next call: a fresh t gives a fresh e, uniform over K, so which body runs is not fixed</text>
</svg>
