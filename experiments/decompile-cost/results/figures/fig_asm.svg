<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans,Arial,sans-serif">
  <style>
    .hd{font-size:12px;font-weight:700;fill:#1c1f24}
    .sub{font-size:9px;fill:#6b7480}
    .m{font-family:"Liberation Mono",monospace;font-size:8.3px;fill:#1c1f24}
    .cmt{font-family:"Liberation Mono",monospace;font-size:8.3px;fill:#6b7480}
    .acc{fill:#0E6B4F}
    .amb{fill:#8C4E08}
  </style>
  <!-- LEFT: naive / plain -->
  <rect x="8" y="30" width="340" height="312" fill="#ffffff" stroke="#0E6B4F" stroke-width="1"/>
  <text x="18" y="22" class="hd">Naive case</text>
  <text x="18" y="44" class="sub">plain even_fib_sum, 63 instructions, one readable loop</text>
  <g transform="translate(18,60)">
    <text y="0"  class="m">even_fib_sum:</text>
    <text y="12" class="m">  mov   $0x1,%ecx          <tspan class="cmt"># a = 1</tspan></text>
    <text y="24" class="m">  mov   $0x2,%r8d          <tspan class="cmt"># b = 2</tspan></text>
    <text y="36" class="m">  xor   %eax,%eax          <tspan class="cmt"># sum = 0</tspan></text>
    <text y="48" class="m">  jmp   .test</text>
    <text y="60" class="m">.step:</text>
    <text y="72" class="m">  mov   %rcx,%r8</text>
    <text y="84" class="m">  add   %rsi,%r8           <tspan class="cmt"># t = a + b</tspan></text>
    <text y="96" class="m">  mov   %rsi,%rcx</text>
    <text y="108" class="m">  cmp   %rdx,%rsi</text>
    <text y="120" class="m">  ja    .done</text>
    <text y="132" class="m">.test:</text>
    <text y="144" class="m">  mov   %r8,%rsi</text>
    <text y="156" class="m">  test  $0x1,%cl           <tspan class="cmt"># even?</tspan></text>
    <text y="168" class="m">  jne   .step</text>
    <text y="180" class="m">  add   %rcx,%rax          <tspan class="cmt"># sum += a</tspan></text>
    <text y="192" class="m">  mov   %rax,0x10(%rdi)</text>
    <text y="204" class="m">  jmp   .step</text>
    <text y="216" class="m">.done:</text>
    <text y="228" class="m">  mov   %r8,0x8(%rdi)</text>
    <text y="240" class="m">  ret</text>
    <text y="262" class="acc" font-family="Liberation Sans" font-size="8.5" font-weight="700">The loop is right there to read.</text>
  </g>

  <!-- RIGHT: methods A + B -->
  <rect x="372" y="30" width="340" height="312" fill="#ffffff" stroke="#8C4E08" stroke-width="1"/>
  <text x="382" y="22" class="hd">Methods A + B (flattened + hardened)</text>
  <text x="382" y="44" class="sub">same function, 3,890 instructions, the loop dissolved</text>
  <g transform="translate(382,60)">
    <text y="0"  class="m">even_fib_sum:</text>
    <text y="12" class="m">  movq  $0x334922b2,-0x10(%rsp) <tspan class="cmt"># masked state</tspan></text>
    <text y="24" class="m">  mov   -0x10(%rsp),%edx</text>
    <text y="36" class="m">  mov   %edx,%ecx</text>
    <text y="48" class="m">  not   %ecx</text>
    <text y="60" class="m">  imul  %edx,%ecx              <tspan class="cmt"># MBA, always 0</tspan></text>
    <text y="72" class="m">  and   $0x1,%ecx</text>
    <text y="84" class="m">  or    $0x1849b6,%rcx         <tspan class="cmt"># real const</tspan></text>
    <text y="96" class="m">  movq  $0xbbf83d4,-0x10(%rsp)</text>
    <text y="108" class="m">  mov   -0x10(%rsp),%edx</text>
    <text y="120" class="m">  not   %esi</text>
    <text y="132" class="m">  imul  %edx,%esi              <tspan class="cmt"># MBA, always 0</tspan></text>
    <text y="144" class="m">  and   $0x1,%esi</text>
    <text y="156" class="cmt">        ... ~130 dispatcher states ...</text>
    <text y="168" class="m">  xor   %rsi,%r9</text>
    <text y="180" class="m">  imul  %rax,%rax              <tspan class="cmt"># a²</tspan></text>
    <text y="192" class="m">  imul  $0x7,%rax,%rcx         <tspan class="cmt"># 7a²</tspan></text>
    <text y="204" class="m">  dec   %rcx                   <tspan class="cmt"># 7a²−1</tspan></text>
    <text y="216" class="m">  cmp   %rcx,%r8               <tspan class="cmt"># ≠ b² (opaque)</tspan></text>
    <text y="228" class="m">  jne   .state_7b3f</text>
    <text y="240" class="cmt">        ... 3,800+ more ...</text>
    <text y="252" class="amb" font-family="Liberation Sans" font-size="8.5" font-weight="700">Same answer. Nothing left to read.</text>
  </g>
</svg>
