<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans,Arial,sans-serif">
  <style>
    .hd{font-size:12px;font-weight:700;fill:#1c1f24}
    .sub{font-size:10px;fill:#6b7480}
    .node{fill:#eef1f0;stroke:#5b6671;stroke-width:1.1}
    .real{fill:#d8ece4;stroke:#0E6B4F;stroke-width:1.5}
    .bogus{fill:#f6f4ef;stroke:#b9a06a;stroke-width:1}
    .ghost{fill:#f6f4ef;stroke:#d8cbac;stroke-width:1;stroke-dasharray:3 2;opacity:.55}
    .e{stroke:#5b6671;stroke-width:1;fill:none;marker-end:url(#m)}
    .er{stroke:#0E6B4F;stroke-width:1.3;fill:none;marker-end:url(#mr)}
    .t{font-size:9px;fill:#1c1f24;font-family:Liberation Mono,monospace}
    .verdict{font-size:10px;font-weight:700}
  </style>
  <defs>
    <marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5b6671"/></marker>
    <marker id="mr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0E6B4F"/></marker>
  </defs>

  <!-- Panel A: flatten only -->
  <text x="20" y="20" class="hd">Method A only</text>
  <text x="20" y="34" class="sub">flatten, router = if true</text>
  <circle cx="90" cy="80" r="20" class="node"/><text x="90" y="83" class="t" text-anchor="middle">disp</text>
  <rect class="ghost" x="20" y="120" width="44" height="18" rx="2"/><text x="42" y="133" class="t" text-anchor="middle">b</text>
  <rect class="ghost" x="116" y="120" width="44" height="18" rx="2"/><text x="138" y="133" class="t" text-anchor="middle">b</text>
  <rect class="real" x="68" y="150" width="44" height="18" rx="2"/><text x="90" y="163" class="t" text-anchor="middle">real</text>
  <path class="er" d="M90,100 L90,148"/>
  <text x="90" y="200" class="verdict" fill="#8C4E08" text-anchor="middle">optimizer folds</text>
  <text x="90" y="214" class="sub" text-anchor="middle">bogus pruned → ≈ plain</text>

  <!-- Panel B: harden only -->
  <text x="260" y="20" class="hd">Method B only</text>
  <text x="260" y="34" class="sub">opaque pred, no bogus</text>
  <circle cx="330" cy="80" r="20" class="node"/><text x="330" y="83" class="t" text-anchor="middle">disp</text>
  <rect class="real" x="308" y="150" width="44" height="18" rx="2"/><text x="330" y="163" class="t" text-anchor="middle">real</text>
  <path class="er" d="M330,100 L330,148"/>
  <text x="408" y="84" class="t">7a²−1≠b²</text>
  <text x="330" y="200" class="verdict" fill="#0E6B4F" text-anchor="middle">survives</text>
  <text x="330" y="214" class="sub" text-anchor="middle">small, constant cost</text>

  <!-- Panel C: both -->
  <text x="500" y="20" class="hd">A + B</text>
  <text x="500" y="34" class="sub">opaque pred routes bogus</text>
  <circle cx="590" cy="80" r="20" class="node"/><text x="590" y="83" class="t" text-anchor="middle">disp</text>
  <rect class="bogus" x="510" y="120" width="40" height="18" rx="2"/><text x="530" y="133" class="t" text-anchor="middle">b</text>
  <rect class="bogus" x="632" y="120" width="40" height="18" rx="2"/><text x="652" y="133" class="t" text-anchor="middle">b</text>
  <rect class="bogus" x="510" y="150" width="40" height="18" rx="2"/><text x="530" y="163" class="t" text-anchor="middle">b</text>
  <rect class="bogus" x="632" y="150" width="40" height="18" rx="2"/><text x="652" y="163" class="t" text-anchor="middle">b</text>
  <rect class="real" x="568" y="158" width="44" height="18" rx="2"/><text x="590" y="171" class="t" text-anchor="middle">real</text>
  <path class="er" d="M590,100 L590,156"/>
  <path class="e" d="M572,94 L544,120"/>
  <path class="e" d="M608,94 L636,120"/>
  <path class="e" d="M572,100 L545,150"/>
  <path class="e" d="M608,100 L636,150"/>
  <text x="590" y="200" class="verdict" fill="#0E6B4F" text-anchor="middle">bogus survive</text>
  <text x="590" y="214" class="sub" text-anchor="middle">CFG grows with the dial</text>
</svg>
